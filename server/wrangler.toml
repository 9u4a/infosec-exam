name = "my-sync"
main = "worker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "STORE"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# GitHub Pages 주소. 로컬(wrangler dev)에서만 테스트할 땐 "*" 로 둬도 됨
ALLOW_ORIGIN = "https://9u4a.github.io"

# PASSPHRASE, TOKEN_SECRET 은 vars 에 두지 말고 secret 으로:
#   wrangler secret put PASSPHRASE
#   wrangler secret put TOKEN_SECRET
